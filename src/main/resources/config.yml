#Название выбранного языка в папке lang
lang_file: ru-RU.yml

#Секция для найтройки вебхуков
webhooks:

  #Настройка вебхуков дискорда
  discord:

    #Будут ли поступать сообщения
    enabled: false

    #Ссылка дискорда кудабудут поступат сообщения
    url:

  #Настройка вебхуков для телеграмма
  telegram:

    #Будут ли поступать сообщения
    enabled: false

    #Токен бота
    bot-token:

    #ЮЗ чата куда будут поступать ообщения
    chat-id:
