#Название выбранного языка в папке lang
lang_file: ru-RU.yml

#Секция для настройки вебхуков
webhooks:

  #Настройка вебхуков дискорда
  discord:

    #Будут ли поступать сообщения
    enabled: false

    #Ссылка дискорда куда будут поступать сообщения
    url:

  #Настройка вебхуков для телеграмма
  telegram:

    #Будут ли поступать сообщения
    enabled: false

    #Токен бота
    bot-token:

    #ЮЗ чата куда будут поступать общения
    chat-id:
