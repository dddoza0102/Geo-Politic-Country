# ══════════════════════════════════════════════════════════════
#  Крафты плагина
# ══════════════════════════════════════════════════════════════
#
#  Каждый крафт описывается в секции crafts под своим уникальным id.
#
#  Поля крафта:
#    - name            название предмета, поддерживает цвета (&#RRGGBB, &c и т.д.)
#    - material        материал готового предмета
#    - lore            описание предмета, список строк
#    - data_container  метка в данных предмета, по ней плагин узнаёт предмет
#    - items           символы для рецепта и материалы, которые они обозначают
#    - recipe          сетка 3x3, три строки, в каждой три символа через ";"
#
#  Плейсхолдеры в name и lore (например {country}) подставляются
#  в момент выдачи предмета, а не при крафте.
# ══════════════════════════════════════════════════════════════

# Включить или выключить все крафты разом
enabled: true

crafts:

  # ────────────────────────────────────────────────────────────
  #  Сертификат на приват чанка государства
  # ────────────────────────────────────────────────────────────
  chunk_country:
    # Название предмета
    name: "&fСертификат на приват чанка государства"
    # Материал готового предмета
    material: paper
    # Описание предмета
    lore:
      - "&fНажмите, чтобы заприватить чанк"
    # Метка в данных предмета, должна быть уникальной у каждого крафта
    data_container: "country_chunk"
    # Символы рецепта: символ -> материал
    items:
      D: diamond
      I: iron_ingot
      P: paper
    # Сетка рецепта: строка 1 это верхний ряд, строка 3 нижний
    recipe:
      1: "I;D;I"
      2: "I;P;I"
      3: "I;I;I"

  # ────────────────────────────────────────────────────────────
  #  Сертификат на приват чанка города
  # ────────────────────────────────────────────────────────────
  chunk_town:
    name: "&fСертификат на приват чанка города"
    material: paper
    lore:
      - "&fНажмите, чтобы заприватить чанк"
    data_container: "town_chunk"
    items:
      D: diamond
      I: iron_ingot
      P: paper
    recipe:
      1: "D;D;D"
      2: "I;P;I"
      3: "I;I;I"

  # ────────────────────────────────────────────────────────────
  #  Флаг страны
  # ────────────────────────────────────────────────────────────
  flag_country:
    # Плейсхолдер: {country} - название страны
    name: "&fФлаг страны {country}"
    # Крафт доступен только игроку в стране: название и цвет баннера берутся от неё
    # Материал не указывается, баннер подбирается по цвету страны
    requires_country: true
    lore:
      - "&fФлаг, который останавливает захват при войне"
      - "&fи поставляет провизию ближайшим игрокам, им также можно захватывать территорию врага"
    data_container: "country_flag"
    items:
      F: white_banner
      D: diamond
    recipe:
      1: "D;D;D"
      2: "D;F;D"
      3: "D;D;D"