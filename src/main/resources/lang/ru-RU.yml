# ══════════════════════════════════════════════════════════════
#  Сообщения плагина
# ══════════════════════════════════════════════════════════════
#
#  Любое сообщение можно писать строкой или списком строк.
#
#  Доступные RGB форматы:
#    - &#RRGGBB          (формат Adventure с кодовым символом)
#    - &x&R&R&G&G&B&B    (формат BungeeCord с кодовым символом)
#    - §x§R§R§G§G§B§B    (формат BungeeCord с секцией)
#    - #RRGGBB           (чистый hex без префиксов)
#
#  Цвета статусов:
#    - &#AD4A4A  ошибка
#    - &#5FE274  успех
#    - &#8988FF  информация
# ══════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────────────────────
#  Общие
# ──────────────────────────────────────────────────────────────

# У игрока недостаточно прав
not_enough_permission: "&#AD4A4A[✘] &fНедостаточно прав"

# Команду написал не игрок (консоль, командный блок)
only_for_players: "&#AD4A4A[✘] &fВы не являетесь игроком"

# У игрока нет государства
you_have_no_country: "&#AD4A4A[✘] У вас нет страны"

# У игрока нет города
you_have_no_town: "&#AD4A4A[✘] У вас нет города"

# ──────────────────────────────────────────────────────────────
#  Создание и переименование страны
# ──────────────────────────────────────────────────────────────

# Не хватает ресурсов для создания страны
# Плейсхолдеры: {sum} - монеты, {item} - название предмета, {amount} - количество
not_enough_resources_for_create_country:
  - "&#AD4A4A[✘] &fНедостаточно ресурсов для создания, нужно также:"
  - "  &#FAD677◆ &fМонет: &c{sum}"
  - "  &#78D4C0◆ &f{item}: &c{amount}"

# Название страны уже занято
name_is_busy: "&#AD4A4A[✘] &fНазвание страны занято"

# Новое название совпадает с текущим
this_name_is_already_specified: "&#AD4A4A[✘] &fСтрана уже называется так"

# Страна переименована, сообщение получают все игроки страны
# Плейсхолдеры: {player}, {old name}, {new name}
player_rename_country:
  - "&8╦"
  - "&8║ &#5FE274[✓] &fИгрок &n{player}&r переименовал страну &m{old name}&r в &n{new name}"
  - "&8╩"


# ──────────────────────────────────────────────────────────────
#  Приглашения
# ──────────────────────────────────────────────────────────────

# Приглашаемый игрок уже состоит в стране
player_already_in_country: "&#AD4A4A[✘] &fИгрок уже состоит в стране"

# Игрок уже получил приглашение от вашей страны
you_already_send_invitation: "&#AD4A4A[✘] &fВы уже пригласили этого игрока"

# Приглашение отправлено, сообщение получает пригласивший
# Плейсхолдер: {player}
invitation_sent: "&#5FE274[✓] &fПриглашение отправлено игроку &n{player}"

# Сообщение, которое получает приглашённый игрок
# Плейсхолдеры: {country}, {confirm} - кнопка принятия, {cancel} - кнопка отказа
# Должно быть строкой, список строк здесь не поддерживается
you_invited_in_country: "&#8988FF[!] &fВас приглашают в страну &n{country}&r. {confirm} &7или &r{cancel}"

# Тексты кнопок из сообщения выше
prefixes:
  success: "&#5FE274[✓ Принять]"
  cancel: "&#AD4A4A[✘ Отклонить]"

# Игрок пытается принять или отклонить приглашение, которого нет или которое истекло
you_have_no_invitation: "&#AD4A4A[✘] &fУ вас нет такого приглашения"

# Игрок отклонил приглашение
invitation_declined: "&#8988FF[!] &fВы отклонили приглашение"


# ──────────────────────────────────────────────────────────────
#  Вступление в страну
# ──────────────────────────────────────────────────────────────

# Игрок пытается вступить, уже состоя в стране
you_already_in_country: "&#AD4A4A[✘] &fВы уже состоите в стране"

# Игрок вступил, сообщение получают все игроки страны
# Плейсхолдеры: {player}, {country}
player_joined_country:
  - "&8╦"
  - "&8║ &#5FE274[✓] &fИгрок &n{player}&r присоединился к стране &n{country}&r. Добро пожаловать!"
  - "&8╩"

# ──────────────────────────────────────────────────────────────
#  Приват региона
# ──────────────────────────────────────────────────────────────

# Игрок пытается заприватить чанк не на границе
chunk_have_no_adjacent_region: "&#AD4A4A[✘] Чанк не на границе"