# Сообщения можно использовать как строку так и список строк
#
# Доступные RGB форматы:
#   - &#RRGGBB          (Формат Adventure с кодовым символом)
#   - &x&R&R&G&G&B&B    (Формат BungeeCord с кодовым символом)
#   - §x§R§R§G§G§B§B    (Формат BungeeCord с секцией)
#   - #RRGGBB           (Чистый Hex-формат без префиксов)
#

#Вызывается если у игрока недостаточно прав
not_enough_permission: "&#AD4A4A[✘] &fНедостаточно прав"

#Вызывается если пользователь пишет команду и не является игроком
only_for_players: "&#AD4A4A[✘] &fВы не являетесь игроком"

#Вызывается если у игрока недостаточно ресурсов для создания гос-ва
not_enough_resources_for_create_country:
  - "&#AD4A4A[✘]&f Недостаточно ресурсов для создания, нужно также:"
  - "  &#FAD677◆ &fМонет: &c{sum}"
  - "  &#78D4C0◆ &f{item}: &c{amount}"

#Вызывается если при создании вы указали название, уже занятое другой страной
name_is_busy: "&#AD4A4A[✘] &fНазвание страны занято"

#Вызывается если при переименовывании вы указали уже текущее имя
this_name_is_already_specified: "&#AD4A4A[✘] &fИмя страны уже такое"

#Вызывается когда игрок переименовал название страны
player_rename_country:
  - "╦"
  - "║ &#5FE274[✓] &fИгрок &n{player}&r переименовал страну &m{old name}&r на новое имя &n{new name}"
  - "╩"

#Вызывается если приглашаем игрок уже в стране
player_already_in_country: "&#AD4A4A[✘] &fИгрок уже в стране"

#Вызывается если вы повторно пригласили игрока пригласили
you_already_send_invitation: "&#AD4A4A[✘] &fВы уже пригласили этого игрока"

#Вызывается когда игрока пригласили в страну
you_invited_in_country: "&#8988FF[!] &fВы были приглашены в страну {country}. Выберите: {accept}/{deny} или проигнорируйте запрос" #!!! запрещено писать в формате списка!!!

#Секция с префиксами
prefixes:
  accpet: "&#AD4A4A[/cancel {request}]"
  cancel: "&#5FE274[/accept {request}]"