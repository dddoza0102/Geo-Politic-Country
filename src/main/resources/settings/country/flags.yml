#Настройка флагов для участников страны
member:

  1:

    #Флаг, разрешающий ломать блоки
    flag: "BREAK"

    #Значение флага
    value: true

  2:

    #Флаг, разрешающий ломать поставленныесамим игроком блоки
    flag: "BREAK_MY"

    #Значение флага
    value: true

  3:

    #Флаг, разрешающий ставить блоки
    flag: "PLACE"

    #Значение флага
    value: true

  4:

    #Флаг, разрешающий ставить блок на координатах, на которых игрок разрушил блок
    flag: "PLACE_MY"

    #Значение флага
    value: true

  5:

    #Флаг, разррешающий использовать(открывать/закрывать) блоки
    flag: "USE"

    #Значение флага
    value: true

  6:

    #Флаг, разррешающий использовать(открывать/закрывать) поставленные игроком блоки
    flag: "USE_MY"

    #Значение флага
    value: true

  7:

    #Флаг, разрешающий бить дружелюбных мобов
    flag: "PVP_ANIMAL"

    #Значение флага
    value: true

  8:

    #Флаг, разрешающий бить враждебных мобов
    flag: "PVP_MONSTER"

    #Значение флага
    value: true


